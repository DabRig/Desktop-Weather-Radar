; DesktopRadar - recent NOAA/NWS radar for a configurable location.
; Observed radar (MRMS base reflectivity). It is not a forecast.
;
; Settings live in @Resources\Settings.inc. See README.md in the project folder.
;
; How it works, in short:
;   MeasureFrame asks NOAA for the newest radar frame time every RefreshMinutes.
;   If that frame is new, Radar.lua points MeasureRadar at an export for that exact
;   time and downloads it into the slot that is NOT on screen (radar_a / radar_b).
;   Only a valid PNG is swapped in, so a failed or garbled download never replaces
;   the last good image.
;   When the location settings change (or on first install), Radar.lua runs a one-time
;   setup: map box, NOAA radar region, nearest NWS stations, and four public-domain
;   US Census map layers. It saves them to Location.inc and DownloadFile\, then refreshes.

[Rainmeter]
; One tick per minute (TickMs): enough for the clock text and the stale check.
Update=#TickMs#
AccurateText=1
DynamicWindowSize=0
ContextTitle=Refresh radar now
ContextAction=[!CommandMeasure MeasureFrame "Update"][!UpdateMeasure MeasureFrame]
ContextTitle2=Open NWS radar (#RadarStation#)
ContextAction2=["#NWSRadarURL#"]
ContextTitle3=Open NWS forecast and alerts
ContextAction3=["#ForecastURL#"]

[Metadata]
Name=DesktopRadar
Author=DabRig
Information=Recent NOAA/NWS radar around a location you choose, on a US Census map. Covers the US, Alaska, Hawaii, the Caribbean and Guam. Observed radar only, not a forecast. Settings: @Resources\Settings.inc.
Version=1.0.0
License=MIT

[Variables]
@Include=#@#Settings.inc
@Include2=#@#Location.inc
@Include3=#@#State.inc
; Internal timing. RefreshMinutes counts ticks, so leave TickMs at 60000.
; (The test harness shortens these on a temporary copy only.)
TickMs=60000
RetrySeconds=180
UserAgent=DesktopRadar/1.0 (+https://github.com/DabRig/Desktop-Weather-Radar)
TigerBase=https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb
LayerDir=#CURRENTPATH#DownloadFile\
ImageServer=https://mapservices.weather.noaa.gov/eventdriven/rest/services/radar/radar_base_reflectivity_time/ImageServer
FrameQuery=#ImageServer#/query?where=name+LIKE+%27#Region#%25%27&outFields=idp_validtime&orderByFields=idp_validtime+DESC&resultRecordCount=1&returnGeometry=false&f=json
ExportBase=#ImageServer#/exportImage?bbox=#BBox#&bboxSR=3857&imageSR=3857&size=#Size#,#Size#&format=png32&transparent=true&interpolation=RSP_NearestNeighbor&f=image
FrameListQuery=#ImageServer#/query?where=name+LIKE+%27#Region#%25%27&outFields=idp_validtime&orderByFields=idp_validtime+DESC&resultRecordCount=16&returnGeometry=false&f=json
NWSApi=https://api.weather.gov
; WindStation, ObsStations, AlertPoint and ForecastURL come from Location.inc.
AlertsURL=#NWSApi#/alerts/active?point=#AlertPoint#
Corner=14
Accent=88,166,255
TextMain=226,233,245
TextDim=148,160,182
Warn=255,184,77
BarFill=10,14,22,195
BarH=40

; ---------------------------------------------------------------- measures

[MeasureScript]
Measure=Script
ScriptFile=#@#Radar.lua

[MeasureFrame]
Measure=WebParser
URL=#FrameQuery#
; Greedy on purpose: with (?U) the capture stops after one digit.
RegExp=(?si)"idp_validtime"\s*:\s*(\d{13})
StringIndex=1
UpdateRate=#RefreshMinutes#
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
FinishAction=[!CommandMeasure MeasureScript "OnFrame()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnError('no radar frame in reply', 'frame')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnError('offline', 'frame')"]

; Starts on a local blank file so loading the skin makes no network request.
; Radar.lua changes URL and DownloadFile, then forces a download.
[MeasureRadar]
Measure=WebParser
URL=file://#@#Images\blank.png
Download=1
DownloadFile=boot.png
UpdateRate=999999
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
FinishAction=[!CommandMeasure MeasureScript "OnRadar()"]
OnDownloadErrorAction=[!CommandMeasure MeasureScript "OnError('radar download failed', 'radar')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnError('offline', 'radar')"]

; ---- Optional: surface wind (ShowWind). Radar.lua falls back to the next station in
; ObsStations when a report has no wind. Off = this measure never runs.
[MeasureWind]
Measure=WebParser
URL=#NWSApi#/stations/#WindStation#/observations/latest
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=#RefreshMinutes#
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
Header=Accept: application/geo+json
Disabled=(1-#ShowWind#)
FinishAction=[!CommandMeasure MeasureScript "OnWind()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnWindError('no reply')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnWindError('offline')"]

; ---- Optional: active NWS alerts for the point (ShowAlerts).
[MeasureAlerts]
Measure=WebParser
URL=#AlertsURL#
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=#RefreshMinutes#
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
Header=Accept: application/geo+json
Disabled=(1-#ShowAlerts#)
FinishAction=[!CommandMeasure MeasureScript "OnAlerts()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnAlertsError('no reply')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnAlertsError('offline')"]

; ---- Optional: replay (AnimationEnabled). These two start on the local blank file and
; only touch the network when the play button is clicked.
[MeasureAnimList]
Measure=WebParser
URL=file://#@#Images\blank.png
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=999999
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
FinishAction=[!CommandMeasure MeasureScript "OnAnimList()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnAnimError('no frame list')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnAnimError('offline')"]

[MeasureAnimFrame]
Measure=WebParser
URL=file://#@#Images\blank.png
Download=1
DownloadFile=boot_anim.png
UpdateRate=999999
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
FinishAction=[!CommandMeasure MeasureScript "OnAnimFrame()"]
OnDownloadErrorAction=[!CommandMeasure MeasureScript "OnAnimError('frame download failed')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnAnimError('offline')"]

; ---- One-time location setup (Radar.lua drives these; idle otherwise).
[MeasureSetupJson]
Measure=WebParser
URL=file://#@#Images\blank.png
RegExp=(?s)^(.*)$
StringIndex=1
UpdateRate=999999
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
Header=Accept: application/geo+json
FinishAction=[!CommandMeasure MeasureScript "OnSetupJson()"]
OnRegExpErrorAction=[!CommandMeasure MeasureScript "OnSetupError('no reply')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnSetupError('offline')"]

[MeasureSetupFile]
Measure=WebParser
URL=file://#@#Images\blank.png
Download=1
DownloadFile=boot_setup.png
UpdateRate=999999
Flags=ForceReload|NoCacheWrite
UserAgent=#UserAgent#
FinishAction=[!CommandMeasure MeasureScript "OnSetupFile()"]
OnDownloadErrorAction=[!CommandMeasure MeasureScript "OnSetupError('map download failed')"]
OnConnectErrorAction=[!CommandMeasure MeasureScript "OnSetupError('offline')"]

; Drives playback only while playing (Rainmeter's bundled ActionTimer plugin).
[MeasureAnimTimer]
Measure=Plugin
Plugin=ActionTimer
ActionList1=Repeat AnimStep, #AnimFrameMs#, 1000
AnimStep=[!CommandMeasure MeasureScript "AnimStep()"]

; ---------------------------------------------------------------- meters

[MeterMask]
Meter=Shape
Shape=Rectangle 0,0,#Size#,#Size#,#Corner# | Fill Color 255,255,255,255 | StrokeWidth 0

; Basemap: public-domain US Census TIGERweb layers, downloaded once per location and
; recoloured here. Each ColorMatrix paints every visible pixel one colour, keeping its alpha.
[MeterMap]
Meter=Shape
Shape=Rectangle 0,0,#Size#,#Size# | Fill Color 13,19,29,255 | StrokeWidth 0
Container=MeterMask
ToolTipText=Open NWS radar (#RadarStation#)
LeftMouseUpAction=["#NWSRadarURL#"]

[MeterLand]
Meter=Image
ImageName=#LayerDir#layer_land.png
W=#Size#
H=#Size#
ColorMatrix1=0;0;0;0;0
ColorMatrix2=0;0;0;0;0
ColorMatrix3=0;0;0;0;0
ColorMatrix4=0;0;0;1;0
ColorMatrix5=0.145;0.173;0.227;0;1
Container=MeterMask
ToolTipText=Open NWS radar (#RadarStation#)
LeftMouseUpAction=["#NWSRadarURL#"]

[MeterWater]
Meter=Image
ImageName=#LayerDir#layer_water.png
W=#Size#
H=#Size#
ColorMatrix1=0;0;0;0;0
ColorMatrix2=0;0;0;0;0
ColorMatrix3=0;0;0;0;0
ColorMatrix4=0;0;0;1;0
ColorMatrix5=0.051;0.075;0.114;0;1
Container=MeterMask

[MeterCounties]
Meter=Image
ImageName=#LayerDir#layer_counties.png
W=#Size#
H=#Size#
ColorMatrix1=0;0;0;0;0
ColorMatrix2=0;0;0;0;0
ColorMatrix3=0;0;0;0;0
ColorMatrix4=0;0;0;0.55;0
ColorMatrix5=0.275;0.345;0.451;0;1
Container=MeterMask

[MeterRoads]
Meter=Image
ImageName=#LayerDir#layer_roads.png
W=#Size#
H=#Size#
ColorMatrix1=0;0;0;0;0
ColorMatrix2=0;0;0;0;0
ColorMatrix3=0;0;0;0;0
ColorMatrix4=0;0;0;0.45;0
ColorMatrix5=0.329;0.408;0.533;0;1
Container=MeterMask

[MeterRadar]
Meter=Image
W=#Size#
H=#Size#
ImageAlpha=#RadarAlpha#
Container=MeterMask
Hidden=1

[MeterMarker]
Meter=Shape
Shape=Ellipse (#Size#/2),(#Size#/2),6.5 | Fill Color 0,0,0,0 | StrokeWidth 3 | Stroke Color 8,12,20,200
Shape2=Ellipse (#Size#/2),(#Size#/2),6.5 | Fill Color 0,0,0,0 | StrokeWidth 1.5 | Stroke Color #Accent#,255
Shape3=Ellipse (#Size#/2),(#Size#/2),1.6 | Fill Color #Accent#,255 | StrokeWidth 0
Container=MeterMask

[MeterTopBar]
Meter=Shape
Shape=Rectangle 0,0,#Size#,24 | Fill Color #BarFill# | StrokeWidth 0
Container=MeterMask
LeftMouseUpAction=["#NWSRadarURL#"]

[MeterTitle]
Meter=String
X=10
Y=5
FontFace=Segoe UI
FontSize=9
StringStyle=Bold
FontColor=#TextMain#
AntiAlias=1
Text=#LocationName#
Container=MeterMask

[MeterRadius]
Meter=String
X=6R
Y=1r
FontFace=Segoe UI
FontSize=7.5
FontColor=#TextDim#
AntiAlias=1
Text=#RadiusKm# km
ToolTipText=Map shows #RadiusKm# km around the center marker
Container=MeterMask

; Play / pause (AnimationEnabled=1 only). Two drawings, one shown at a time.
[MeterPlay]
Meter=Shape
X=(#Size#-22)
Y=5
Shape=Rectangle 0,0,14,14,3 | Fill Color #Accent#,40 | StrokeWidth 0
Shape2=Path PlayTri | Fill Color #Accent#,255 | StrokeWidth 0
PlayTri=5,3.5 | LineTo 11,7 | LineTo 5,10.5 | ClosePath 1
Hidden=1
ToolTipText=Replay the past hour of radar (observed, not a forecast)
LeftMouseUpAction=[!CommandMeasure MeasureScript "AnimToggle()"]
Container=MeterMask

[MeterPause]
Meter=Shape
X=(#Size#-22)
Y=5
Shape=Rectangle 0,0,14,14,3 | Fill Color #Accent#,40 | StrokeWidth 0
Shape2=Rectangle 4,3.5,2.2,7 | Fill Color #Accent#,255 | StrokeWidth 0
Shape3=Rectangle 7.8,3.5,2.2,7 | Fill Color #Accent#,255 | StrokeWidth 0
Hidden=1
ToolTipText=Pause replay
LeftMouseUpAction=[!CommandMeasure MeasureScript "AnimToggle()"]
Container=MeterMask

; Surface wind: arrow points the way the wind is blowing TO; text says where it is FROM.
[MeterWindText]
Meter=String
X=(#Size#-26-18*#AnimationEnabled#)
Y=6
StringAlign=Right
FontFace=Segoe UI
FontSize=7.5
FontColor=#TextDim#
AntiAlias=1
Text=
Hidden=1
Container=MeterMask

[MeterWindArrow]
Meter=Shape
X=(#Size#-22-18*#AnimationEnabled#)
Y=5
Shape=Path WindPath | Fill Color #TextMain#,230 | StrokeWidth 0 | Rotate 0,7,7
WindPath=7,1 | LineTo 11,9 | LineTo 7.8,7.6 | LineTo 7.8,13 | LineTo 6.2,13 | LineTo 6.2,7.6 | LineTo 3,9 | ClosePath 1
Hidden=1
Container=MeterMask

; Active alert chip, below the title bar on the left.
[MeterAlert]
Meter=String
X=8
Y=30
FontFace=Segoe UI
FontSize=7.5
StringStyle=Bold
FontColor=255,255,255
SolidColor=200,50,50,215
Padding=6,2,6,2
AntiAlias=1
Text=
Hidden=1
LeftMouseUpAction=["#ForecastURL#"]
Container=MeterMask

[MeterBadge]
Meter=String
X=(#Size#-8)
Y=30
StringAlign=Right
FontFace=Segoe UI
FontSize=7.5
StringStyle=Bold
FontColor=#Warn#
SolidColor=#Warn#,45
Padding=5,1,5,1
AntiAlias=1
Text=STALE
Group=Info
Hidden=1
Container=MeterMask

[MeterBottomBar]
Meter=Shape
Shape=Rectangle 0,(#Size#-#BarH#),#Size#,#BarH# | Fill Color #BarFill# | StrokeWidth 0
Container=MeterMask
LeftMouseUpAction=["#NWSRadarURL#"]

[MeterObs]
Meter=String
X=10
Y=(#Size#-#BarH#+5)
FontFace=Segoe UI
FontSize=9
StringStyle=Bold
FontColor=#TextMain#
AntiAlias=1
Text=Radar --
Group=Info
ToolTipText=Time of the radar observation shown (NOAA MRMS)
Container=MeterMask

[MeterFetched]
Meter=String
X=10
Y=(#Size#-#BarH#+22)
FontFace=Segoe UI
FontSize=7.5
FontColor=#TextDim#
AntiAlias=1
Text=Waiting for first download
Group=Info
ToolTipText=Last successful download
Container=MeterMask

[MeterLegend]
Meter=Shape
X=(#Size#-112)
Y=(#Size#-#BarH#+8)
Shape=Rectangle 0,0,102,6,3 | Fill LinearGradient RadarRamp | StrokeWidth 0
; Colour stops sampled from this service's own output (nearest-neighbour export).
RadarRamp=180 |100,120,168,255 ; 0.0 | 94,173,207,255 ; 0.16 | 14,214,20,255 ; 0.36 | 9,98,10,255 ; 0.54 | 255,226,0,255 ; 0.68 | 255,124,0,255 ; 0.82 | 255,0,0,255 ; 0.93 | 185,0,0,255 ; 1.0
Container=MeterMask
ToolTipText=Radar reflectivity: light precipitation (blue/green) to heavy (yellow/red)

[MeterLegendLight]
Meter=String
X=(#Size#-112)
Y=(#Size#-#BarH#+15)
FontFace=Segoe UI
FontSize=6.5
FontColor=#TextDim#
AntiAlias=1
Text=Light
Container=MeterMask

[MeterLegendHeavy]
Meter=String
X=(#Size#-10)
Y=(#Size#-#BarH#+15)
StringAlign=Right
FontFace=Segoe UI
FontSize=6.5
FontColor=#TextDim#
AntiAlias=1
Text=Heavy
Container=MeterMask

[MeterCredit]
Meter=String
X=(#Size#-10)
Y=(#Size#-#BarH#+26)
StringAlign=Right
FontFace=Segoe UI
FontSize=6
FontColor=#TextDim#,190
AntiAlias=1
Text=NOAA/NWS | US Census TIGER
Container=MeterMask

[MeterBorder]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#Size#-1),(#Size#-1),#Corner# | Fill Color 0,0,0,0 | StrokeWidth 1 | Stroke Color #Accent#,90
