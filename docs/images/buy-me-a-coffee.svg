<svg xmlns="http://www.w3.org/2000/svg" width="236" height="56" viewBox="0 0 236 56" role="img" aria-label="Buy me a coffee">
  <defs>
    <linearGradient id="btn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe44d"/>
      <stop offset="1" stop-color="#ffd100"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a5b2c"/>
      <stop offset="1" stop-color="#5a3014"/>
    </linearGradient>
    <!-- inside of the cup: coffee only shows within this shape -->
    <clipPath id="cupInside">
      <path d="M20.5 22 H35.5 L34 37 Q33.6 39.5 31 39.5 H25 Q22.4 39.5 22 37 Z"/>
    </clipPath>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- button body -->
  <rect x="4" y="3" width="228" height="46" rx="23" fill="url(#btn)" filter="url(#drop)"/>
  <rect x="4.5" y="3.5" width="227" height="45" rx="22.5" fill="none" stroke="#000" stroke-opacity="0.12"/>
  <rect x="10" y="6" width="216" height="14" rx="7" fill="#fff" fill-opacity="0.28"/>

  <!-- coffee filling up the cup, then starting again -->
  <g clip-path="url(#cupInside)">
    <rect x="18" y="40" width="22" height="20" fill="url(#coffee)">
      <animate attributeName="y" values="40;40;25;25;40" keyTimes="0;0.08;0.55;0.92;1" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <!-- a little wave on the surface -->
    <path d="M18 0 q2.5 -1.6 5 0 t5 0 t5 0 t5 0 t5 0 v3 h-25 z" fill="#b8763f">
      <animateTransform attributeName="transform" type="translate" values="0 40;0 40;0 25;0 25;0 40" keyTimes="0;0.08;0.55;0.92;1" dur="3.2s" repeatCount="indefinite" additive="replace"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-5 0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
    </path>
  </g>
  <!-- pouring stream, only while filling -->
  <rect x="27.3" y="10" width="1.6" height="0" rx="0.8" fill="#6b3a18">
    <animate attributeName="height" values="0;29;16;0;0" keyTimes="0;0.08;0.5;0.56;1" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="y" values="10;10;10;26;26" keyTimes="0;0.08;0.5;0.56;1" dur="3.2s" repeatCount="indefinite"/>
  </rect>

  <!-- cup outline, handle and saucer -->
  <path d="M20.5 22 H35.5 L34 37 Q33.6 39.5 31 39.5 H25 Q22.4 39.5 22 37 Z" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linejoin="round"/>
  <path d="M35 25 h1.8 a3.4 3.4 0 0 1 0 6.8 h-2.4" fill="none" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M18.5 41.6 H37.5" stroke="#1a1a1a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- steam, once the cup is full -->
  <g fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-linecap="round" opacity="0">
    <path d="M25 19 q-1.6 -2.4 0 -4.8 t0 -4.8"/>
    <path d="M30.5 19 q-1.6 -2.4 0 -4.8 t0 -4.8"/>
    <animate attributeName="opacity" values="0;0;0.7;0.7;0" keyTimes="0;0.55;0.65;0.88;1" dur="3.2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 2;0 2;0 0;0 -2;0 -2" keyTimes="0;0.55;0.65;0.88;1" dur="3.2s" repeatCount="indefinite"/>
  </g>

  <!-- label -->
  <text x="132" y="32" text-anchor="middle" fill="#1a1a1a" font-family="'Cookie','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="0.2">Buy me a coffee</text>
</svg>
