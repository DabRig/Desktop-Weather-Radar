<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="DesktopRadar: live NOAA weather radar on your Windows desktop">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a101c"/>
      <stop offset="1" stop-color="#121d33"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="scope"><circle cx="190" cy="160" r="118"/></clipPath>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#58a6ff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="318" rx="21" fill="none" stroke="#58a6ff" stroke-opacity="0.25"/>

  <!-- radar scope -->
  <circle cx="190" cy="160" r="150" fill="url(#glow)"/>
  <g clip-path="url(#scope)">
    <circle cx="190" cy="160" r="118" fill="#0d1626"/>
    <!-- precipitation echoes, coloured like the NWS reflectivity ramp -->
    <g filter="url(#soft)">
      <ellipse cx="235" cy="118" rx="34" ry="18" fill="#0ed614" opacity="0.75" transform="rotate(-25 235 118)">
        <animate attributeName="opacity" values="0.45;0.85;0.45" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="246" cy="112" rx="13" ry="8" fill="#ffe200" opacity="0.9" transform="rotate(-25 246 112)">
        <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="250" cy="110" r="4" fill="#ff2000"/>
      <ellipse cx="140" cy="205" rx="40" ry="16" fill="#5eadcf" opacity="0.7" transform="rotate(30 140 205)">
        <animate attributeName="opacity" values="0.35;0.75;0.35" dur="5s" begin="1s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="150" cy="200" rx="18" ry="8" fill="#0ed614" opacity="0.8" transform="rotate(30 150 200)"/>
      <ellipse cx="128" cy="120" rx="20" ry="11" fill="#5eadcf" opacity="0.55"/>
    </g>
    <!-- rotating sweep -->
    <g>
      <path d="M190 160 L308 160 A118 118 0 0 0 273.4 76.6 Z" fill="url(#sweep)"/>
      <line x1="190" y1="160" x2="308" y2="160" stroke="#9cc9ff" stroke-width="2" stroke-opacity="0.9"/>
      <animateTransform attributeName="transform" type="rotate" from="0 190 160" to="-360 190 160" dur="4s" repeatCount="indefinite"/>
    </g>
  </g>
  <g fill="none" stroke="#58a6ff" stroke-opacity="0.35">
    <circle cx="190" cy="160" r="118" stroke-opacity="0.6" stroke-width="1.5"/>
    <circle cx="190" cy="160" r="79"/>
    <circle cx="190" cy="160" r="40"/>
    <line x1="72" y1="160" x2="308" y2="160"/>
    <line x1="190" y1="42" x2="190" y2="278"/>
  </g>
  <circle cx="190" cy="160" r="6.5" fill="none" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="190" cy="160" r="2" fill="#58a6ff"/>

  <!-- title -->
  <g font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
    <text x="392" y="138" fill="#e2e9f5" font-size="68" font-weight="700" letter-spacing="-1">Desktop<tspan fill="#58a6ff">Radar</tspan></text>
    <text x="395" y="184" fill="#94a0b6" font-size="25">Live NOAA weather radar on your Windows desktop.</text>
    <g font-size="16" font-weight="600">
      <rect x="395" y="214" width="150" height="34" rx="17" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/>
      <text x="470" y="236" fill="#9cc9ff" text-anchor="middle">Rainmeter skin</text>
      <rect x="557" y="214" width="170" height="34" rx="17" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/>
      <text x="642" y="236" fill="#9cc9ff" text-anchor="middle">Official NWS data</text>
      <rect x="739" y="214" width="122" height="34" rx="17" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/>
      <text x="800" y="236" fill="#9cc9ff" text-anchor="middle">~3 MB RAM</text>
      <rect x="873" y="214" width="112" height="34" rx="17" fill="#58a6ff" fill-opacity="0.14" stroke="#58a6ff" stroke-opacity="0.4"/>
      <text x="929" y="236" fill="#9cc9ff" text-anchor="middle">No scripts</text>
    </g>
  </g>

  <!-- legend ramp -->
  <defs>
    <linearGradient id="ramp" x1="0" x2="1">
      <stop offset="0" stop-color="#6478a8"/><stop offset="0.16" stop-color="#5eadcf"/>
      <stop offset="0.36" stop-color="#0ed614"/><stop offset="0.54" stop-color="#09620a"/>
      <stop offset="0.68" stop-color="#ffe200"/><stop offset="0.82" stop-color="#ff7c00"/>
      <stop offset="0.93" stop-color="#ff0000"/><stop offset="1" stop-color="#b90000"/>
    </linearGradient>
  </defs>
  <rect x="1060" y="262" width="180" height="8" rx="4" fill="url(#ramp)"/>
  <g font-family="'Segoe UI', -apple-system, Arial, sans-serif" font-size="13" fill="#94a0b6">
    <text x="1060" y="290">Light</text>
    <text x="1240" y="290" text-anchor="end">Heavy</text>
  </g>
</svg>
